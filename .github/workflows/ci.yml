name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 静态检查与编译
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          test -z "$(gofmt -l .)" || { echo "以下文件未格式化："; gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: 交叉编译（linux/amd64、linux/arm64）
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "==> linux/${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} \
              go build -trimpath -ldflags="-s -w" -o /dev/null .
          done
